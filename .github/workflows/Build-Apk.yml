name: Build APK
on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip Source Code
        run: unzip -q FRX-TOOLS-crosshair-source.zip

      # Menampilkan isi folder agar kita tahu strukturnya benar
      - name: Cek Struktur Folder (Debug)
        run: ls -la

      # Mengubah useAndroidX dengan aman
      - name: Ubah useAndroidX
        run: |
          if [ -f GrafikMcByFaruq/gradle.properties ]; then
            sed -i 's/useAndroidX=false/useAndroidX=true/' GrafikMcByFaruq/gradle.properties
            echo "Berhasil mengubah useAndroidX."
          else
            echo "Peringatan: gradle.properties tidak ditemukan di GrafikMcByFaruq."
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build APK
        run: gradle assembleDebug --no-daemon
        working-directory: GrafikMcByFaruq

      - uses: actions/upload-artifact@v4
        with:
          name: FRX-TOOLS-APK
          path: GrafikMcByFaruq/app/build/outputs/apk/debug/app-debug.apk
