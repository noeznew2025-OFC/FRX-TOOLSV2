- name: Build APK
        shell: bash
        run: |
          echo "=== DAFTAR FILE REPOSITORY ==="
          ls -la

          SETTINGS=$(find . -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle tidak ditemukan."
            echo "Periksa apakah source project sudah di-upload."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "Project ditemukan: $PROJECT_DIR"

          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon
