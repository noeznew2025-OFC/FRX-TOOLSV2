name: Build FRX TOOLS APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle assembleDebug --no-daemon
        working-directory: GrafikMcByFaruq

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FRX-TOOLS-APK
          path: GrafikMcByFaruq/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
